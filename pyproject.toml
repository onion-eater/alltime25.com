[project]
name = "alltime25-tools"
version = "0.1.0"
description = "Offline catalog tooling for AllTime 25"
requires-python = ">=3.12,<3.15"
dependencies = [
  "nba-api>=1.11.4",
  "pillow>=11.3,<13",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
package = false
link-mode = "copy"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
