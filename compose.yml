services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: alltime25_test
      POSTGRES_USER: alltime25
      POSTGRES_PASSWORD: alltime25
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alltime25 -d alltime25_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  postgres-beta:
    image: postgres:17-alpine
    profiles: ["beta"]
    environment:
      POSTGRES_DB: alltime25
      POSTGRES_USER: alltime25
      POSTGRES_PASSWORD: alltime25-local-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alltime25 -d alltime25"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - alltime25-beta-data:/var/lib/postgresql/data

  app:
    profiles: ["beta"]
    build:
      context: .
    environment:
      ALLTIME25_ALLOWED_ORIGIN: http://127.0.0.1:8000
      ALLTIME25_CURRENT_CATALOG_ID: nba-public-2025-26-r1
      ALLTIME25_DATABASE_URL: postgresql+psycopg://alltime25:alltime25-local-only@postgres-beta:5432/alltime25
      ALLTIME25_ENVIRONMENT_NAME: beta
      ALLTIME25_LOG_LEVEL: INFO
    depends_on:
      postgres-beta:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  alltime25-beta-data:
