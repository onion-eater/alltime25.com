[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blind50-api"
version = "0.1.0"
description = "Blind 50 ranking API"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<0.200",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "hypothesis>=6.138,<7",
  "httpx>=0.28,<1",
  "pillow>=11.3,<13",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blind50"]

[tool.pytest.ini_options]
pythonpath = ["src", "../.."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
